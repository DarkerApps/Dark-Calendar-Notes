name: Build Dark Notes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Compile Dark Notes Web Bundle (static SPA)
        run: |
          mkdir -p web-src offline-app/app/src/main/assets
          export ASSETS_OUT="$GITHUB_WORKSPACE/offline-app/app/src/main/assets"
          export DIAG="$GITHUB_WORKSPACE/diag.txt"
          : > "$DIAG"

          ZIP_FILE=""
          for z in ./*.zip; do
            if unzip -p "$z" '*vite.config.ts' 2>/dev/null | grep -q "BUILD_TARGET"; then
              ZIP_FILE="$z"
              break
            fi
          done
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: no zip with BUILD_TARGET=apk support found in repo root."
            echo "Upload the NEW dark-notes-source.zip to the repo root."
            ls -la
            exit 1
          fi
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d web-src

          PKG_PATH=$(find web-src -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | awk '{print length($0) " " $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found in zip!"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          echo "Building Dark Notes from: $APP_DIR"
          cd "$APP_DIR"

          bun install || npm install --legacy-peer-deps

          export BUILD_TARGET=apk
          ./node_modules/.bin/vite build

          echo "===== dist/client ====="
          ls -la dist dist/client 2>&1 | head -40
          if [ ! -f dist/client/index.html ]; then
            echo "ERROR: dist/client/index.html missing - BUILD_TARGET=apk build did not produce a static page."
            exit 1
          fi

          cat > "$GITHUB_WORKSPACE/assemble.py" << 'PYEOF'
          import os, shutil, glob, re

          assets_out = os.environ["ASSETS_OUT"]
          diag = os.environ["DIAG"]
          os.makedirs(assets_out, exist_ok=True)
          shutil.copytree("dist/client", assets_out, dirs_exist_ok=True)

          for pattern in ["sw.js", "workbox-*.js", "registerSW.js", "_headers", "_redirects"]:
              for f in glob.glob(os.path.join(assets_out, pattern)):
                  os.remove(f)

          OVERLAY = """<script>
          (function(){
            function show(m){
              var d=document.getElementById('__err');
              if(!d){
                d=document.createElement('pre');
                d.id='__err';
                d.style.cssText='position:fixed;left:0;right:0;top:0;max-height:30%;overflow:auto;margin:0;padding:8px;background:#300;color:#fff;font:11px monospace;z-index:2147483647;white-space:pre-wrap';
                (document.body||document.documentElement).appendChild(d);
              }
              d.textContent+=m+'\\n';
            }
            window.addEventListener('error',function(e){show('ERR: '+e.message+' @'+(e.filename||'')+':'+e.lineno);});
            window.addEventListener('unhandledrejection',function(e){show('REJ: '+((e.reason&&e.reason.stack)||e.reason));});
          })();
          </script>"""

          index_path = os.path.join(assets_out, "index.html")
          html = open(index_path, encoding="utf-8").read()
          html = re.sub(r'<script[^>]*registerSW[^>]*>\s*</script>', '', html)
          if re.search(r'<head[^>]*>', html):
              html = re.sub(r'(<head[^>]*>)', lambda m: m.group(1) + OVERLAY, html, count=1)
          else:
              html = OVERLAY + html
          with open(index_path, "w", encoding="utf-8") as fp:
              fp.write(html)

          assets_sub = os.path.join(assets_out, "assets")
          listing = sorted(os.listdir(assets_sub))[:40] if os.path.isdir(assets_sub) else []
          with open(diag, "a", encoding="utf-8") as d:
              d.write("== index.html bytes: %d ==\n" % len(html))
              d.write("== assets/ files ==\n" + "\n".join(listing) + "\n")
              d.write("== script tags ==\n" + "\n".join(re.findall(r'<script[^>]*>', html)) + "\n")
          print("index.html ready, bytes =", len(html))
          PYEOF
          python3 "$GITHUB_WORKSPACE/assemble.py"

          {
            echo "== index.html (last 1500 chars) =="
            tail -c 1500 "$ASSETS_OUT/index.html"
            echo
            echo "== assets root =="
            ls "$ASSETS_OUT"
          } >> "$DIAG"
          cp "$DIAG" "$ASSETS_OUT/diag.txt"
          cat "$DIAG"

      - name: Create Dark Notes Offline Android Project
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p offline-app/app/src/main/assets
          mkdir -p offline-app/app/src/main/java/com/priyamrai/darknotes
          mkdir -p offline-app/app/src/main/res/values
          mkdir -p offline-app/app/src/main/res/xml
          mkdir -p offline-app/app/src/main/res/drawable

          cat > offline-app/app/src/main/assets/test.html << 'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Test</title>
            </head>
            <body style="background:#222;color:#0f0;font:20px monospace;padding:16px">
              <h1>WebView OK</h1>
              <p id="js">JS not running</p>
              <script>document.getElementById('js').textContent = 'JS OK';</script>
            </body>
          </html>
          EOF

          if [ -f release-keystore/android.keystore ]; then
            echo "Reusing keystore from repo"
            cp release-keystore/android.keystore offline-app/app/android.keystore
          else
            echo "Generating new keystore"
            keytool -genkeypair -v \
              -keystore offline-app/app/android.keystore \
              -alias darknotes \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=Dark Notes, OU=App, O=Priyam Rai, L=Lucknow, ST=UP, C=IN"
          fi

          cat > "$GITHUB_WORKSPACE/icon.py" << 'PYEOF'
          import struct, zlib
          w, h = 192, 192
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx, dy = x - w // 2, y - h // 2
                  if -36 <= dx <= 36 and -48 <= dy <= 48 and (abs(dx) > 28 or abs(dy) > 40 or (-20 <= dx <= 20 and dy in (-16, 0, 16))):
                      raw.extend((235, 235, 235, 255))
                  else:
                      raw.extend((0, 0, 0, 255))
          def chunk(tag, data):
              return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                 + chunk(b"IEND", b""))
          open("offline-app/app/src/main/res/drawable/ic_launcher.png", "wb").write(png)
          PYEOF
          python3 "$GITHUB_WORKSPACE/icon.py"

          cat > offline-app/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > offline-app/settings.gradle << 'EOF'
          rootProject.name = "DarkNotesOffline"
          include ':app'
          EOF

          cat > offline-app/build.gradle << 'EOF'
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.5.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat > offline-app/app/build.gradle << 'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace "com.priyamrai.darknotes"
            compileSdk 34
            defaultConfig {
              applicationId "com.priyamrai.darknotes"
              minSdk 24
              targetSdk 34
              versionCode 5
              versionName "1.4-debug"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint {
              checkReleaseBuilds false
              abortOnError false
            }
            signingConfigs {
              release {
                storeFile file("android.keystore")
                storePassword "android123"
                keyAlias "darknotes"
                keyPassword "android123"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
                shrinkResources false
              }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat > offline-app/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
            <string name="app_name">Dark Notes</string>
          </resources>
          EOF

          cat > offline-app/app/src/main/res/values/styles.xml << 'EOF'
          <resources>
            <style name="Theme.DarkNotes" parent="Theme.AppCompat.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
            </style>
          </resources>
          EOF

          cat > offline-app/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          EOF

          cat > offline-app/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="@string/app_name"
              android:icon="@drawable/ic_launcher"
              android:theme="@style/Theme.DarkNotes"
              android:networkSecurityConfig="@xml/network_security_config"
              android:hardwareAccelerated="true"
              android:allowBackup="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:windowSoftInputMode="adjustResize"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > offline-app/app/src/main/java/com/priyamrai/darknotes/MainActivity.java << 'EOF'
          package com.priyamrai.darknotes;

          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.method.ScrollingMovementMethod;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.HashMap;

          public class MainActivity extends AppCompatActivity {
            private static final String HOST = "appassets.androidplatform.net";
            private static final String BASE = "https://" + HOST;
            private WebView webView;
            private TextView dbg;
            private boolean showDiag = false;
            private String diagText = "";
            private final StringBuilder logBuf = new StringBuilder();

            private static final String DUMP_JS =
              "(function(){var r=document.getElementById('root');"
              + "return 'bodyLen='+document.body.innerHTML.length+' rootLen='+(r?r.innerHTML.length:'none')"
              + "+' scripts='+document.scripts.length+' text='+document.body.innerText.slice(0,200);})()";

            private void log(final String s) {
              runOnUiThread(new Runnable() {
                @Override
                public void run() {
                  logBuf.insert(0, s + "\n");
                  if (logBuf.length() > 12000) logBuf.setLength(12000);
                  if (dbg != null && !showDiag) dbg.setText(logBuf.toString());
                }
              });
            }

            private String readAsset(String name) {
              try {
                InputStream is = getAssets().open(name);
                ByteArrayOutputStream bos = new ByteArrayOutputStream();
                byte[] buf = new byte[8192];
                int n;
                while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
                is.close();
                return bos.toString("UTF-8");
              } catch (Exception e) {
                return "READ FAILED " + name + ": " + e;
              }
            }

            private void showPanel() {
              runOnUiThread(new Runnable() {
                @Override
                public void run() { dbg.setVisibility(View.VISIBLE); }
              });
            }

            private void checkBlank(final String label) {
              webView.evaluateJavascript("document.body?document.body.innerText.length:-1",
                  new android.webkit.ValueCallback<String>() {
                    @Override
                    public void onReceiveValue(String v) {
                      log(label + " textLen=" + v);
                      try {
                        int n = Integer.parseInt(v.trim());
                        if (n < 20) showPanel();
                      } catch (Exception e) {
                        showPanel();
                      }
                    }
                  });
            }

            @Override
            public boolean onKeyDown(int keyCode, KeyEvent event) {
              if (keyCode == KeyEvent.KEYCODE_VOLUME_UP) {
                dbg.setVisibility(dbg.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                return true;
              }
              return super.onKeyDown(keyCode, event);
            }

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              FrameLayout root = new FrameLayout(this);
              webView = new WebView(this);
              webView.setLayoutParams(new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              webView.setBackgroundColor(Color.BLACK);
              root.addView(webView);

              dbg = new TextView(this);
              dbg.setTextColor(0xFF00FF66);
              dbg.setBackgroundColor(0xEE111111);
              dbg.setTextSize(10);
              dbg.setTypeface(android.graphics.Typeface.MONOSPACE);
              dbg.setMovementMethod(new ScrollingMovementMethod());
              dbg.setPadding(8, 8, 8, 8);
              dbg.setVisibility(View.GONE);
              int h = (int) (getResources().getDisplayMetrics().heightPixels * 0.50f);
              FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, h);
              lp.gravity = Gravity.BOTTOM;
              root.addView(dbg, lp);

              diagText = readAsset("diag.txt");

              dbg.setOnClickListener(new View.OnClickListener() {
                @Override
                public void onClick(View v) {
                  showDiag = !showDiag;
                  dbg.setText(showDiag ? ("BUILD REPORT (tap = back to log)\n" + diagText) : logBuf.toString());
                  dbg.scrollTo(0, 0);
                }
              });
              dbg.setOnLongClickListener(new View.OnLongClickListener() {
                @Override
                public boolean onLongClick(View v) {
                  log("LOADING test.html");
                  webView.loadUrl(BASE + "/test.html");
                  return true;
                }
              });

              log("Dark Notes debug build 5 (Volume Up = toggle panel, tap = build report, long-press = test.html)");

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowFileAccess(false);
              settings.setAllowContentAccess(false);
              settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

              final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();

              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onConsoleMessage(ConsoleMessage cm) {
                  log("JS " + cm.messageLevel() + ": " + cm.message() + " @" + cm.sourceId() + ":" + cm.lineNumber());
                  return true;
                }
              });

              webView.setWebViewClient(new WebViewClientCompat() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  Uri url = request.getUrl();
                  if (HOST.equals(url.getHost())) {
                    String path = url.getPath();
                    if (path == null || path.isEmpty() || path.equals("/") || !path.contains(".")) {
                      if (path != null && (path.startsWith("/_") || path.startsWith("/api/"))) {
                        log("BLOCKED " + path);
                        return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found",
                            new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                      }
                      log("REQ " + path + " -> index.html");
                      return assetLoader.shouldInterceptRequest(Uri.parse(BASE + "/index.html"));
                    }
                    log("REQ " + path);
                  }
                  return assetLoader.shouldInterceptRequest(url);
                }

                @Override
                public void onPageStarted(WebView view, String url, Bitmap favicon) {
                  log("page started: " + url);
                }

                @Override
                public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse errorResponse) {
                  log("HTTP ERR " + errorResponse.getStatusCode() + " " + request.getUrl());
                }

                @Override
                public void onPageFinished(WebView view, String url) {
                  log("page finished: " + url);
                  webView.postDelayed(new Runnable() {
                    @Override
                    public void run() {
                      webView.evaluateJavascript(DUMP_JS, new android.webkit.ValueCallback<String>() {
                        @Override
                        public void onReceiveValue(String v) { log("DOM@3s: " + v); }
                      });
                    }
                  }, 3000);
                  webView.postDelayed(new Runnable() {
                    @Override
                    public void run() { checkBlank("blank-check@4s"); }
                  }, 4000);
                  webView.postDelayed(new Runnable() {
                    @Override
                    public void run() { checkBlank("blank-check@9s"); }
                  }, 9000);
                }
              });

              setContentView(root);
              webView.loadUrl(BASE + "/");
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          EOF

      - name: Compile Signed Dark Notes APK
        run: |
          cd offline-app
          gradle assembleRelease --no-daemon --stacktrace

      - name: Package Dark Notes APK & Keystore
        run: |
          mkdir -p release-bundle
          cp offline-app/app/build/outputs/apk/release/app-release.apk release-bundle/Dark-Notes-Offline.apk
          cp offline-app/app/android.keystore release-bundle/android.keystore

      - name: Upload Dark Notes APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Notes-Offline-APK
          path: release-bundle/
