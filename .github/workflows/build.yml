name: Build Dark Notes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Compile Dark Notes Web Bundle
        run: |
          mkdir -p web-src offline-app/app/src/main/assets
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d web-src
          else
            cp -r ./* web-src/ 2>/dev/null || true
          fi

          PKG_PATH=$(find web-src -maxdepth 3 -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found in Dark Notes ZIP!"
            exit 1
          fi

          APP_DIR=$(dirname "$PKG_PATH")
          echo "Building Dark Notes from: $APP_DIR"
          cd "$APP_DIR"
          npm install --legacy-peer-deps
          npm run build

          ASSETS_OUT="$GITHUB_WORKSPACE/offline-app/app/src/main/assets"
          COPIED=0

          for CANDIDATE in "dist/client" ".output/public" "dist" "build"; do
            if [ -d "$CANDIDATE" ]; then
              echo "Copying build output from: $CANDIDATE"
              cp -r "$CANDIDATE"/* "$ASSETS_OUT/" 2>/dev/null || true
              COPIED=1
              if [ -f "$CANDIDATE/index.html" ]; then
                cp -f "$CANDIDATE/index.html" "$ASSETS_OUT/index.html"
              fi
              break
            fi
          done

          if [ "$COPIED" -eq 0 ]; then
            FOUND_HTML=$(find . -maxdepth 4 -name "index.html" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              FOUND_DIR=$(dirname "$FOUND_HTML")
              cp -r "$FOUND_DIR"/* "$ASSETS_OUT/" 2>/dev/null || true
              COPIED=1
            fi
          fi

          if [ "$COPIED" -eq 0 ]; then
            echo "ERROR: No web build output directory found!"
            exit 1
          fi

          rm -f "$ASSETS_OUT/sw.js" "$ASSETS_OUT/workbox-"*.js

          if [ ! -f "$ASSETS_OUT/index.html" ]; then
            echo "Creating fallback index.html for offline WebViewAssetLoader..."
            cat << 'EOF' > "$ASSETS_OUT/index.html"
<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Notes</title>
    <style>
      html, body, #root, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app"></div>
    <script type="module">
      import('./assets/main.js').catch(() => {});
    </script>
  </body>
</html>
EOF
          fi

          echo "Final assets root contents:"
          ls -la "$ASSETS_OUT/"

      - name: Generate Dark Notes Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias darknotes \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Dark Notes, OU=App, O=Priyam Rai, L=Lucknow, S=UP, C=IN"

      - name: Create Dark Notes Offline Android Project
        run: |
          mkdir -p offline-app/app/src/main/java/com/priyamrai/darknotes
          mkdir -p offline-app/app/src/main/res/values
          mkdir -p offline-app/app/src/main/res/xml

          cat << 'EOF' > offline-app/settings.gradle
          rootProject.name = "DarkNotesOffline"
          include ':app'
          EOF

          cat << 'EOF' > offline-app/build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          task clean(type: Delete) {
            delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > offline-app/app/build.gradle
          plugins {
            id 'com.android.application'
          }

          android {
            namespace "com.priyamrai.darknotes"
            compileSdk 34

            defaultConfig {
              applicationId "com.priyamrai.darknotes"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            signingConfigs {
              release {
                storeFile file("../../android.keystore")
                storePassword "android123"
                keyAlias "darknotes"
                keyPassword "android123"
              }
            }

            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
                shrinkResources false
              }
            }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat << 'EOF' > offline-app/app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">Dark Notes</string>
          </resources>
          EOF

          cat << 'EOF' > offline-app/app/src/main/res/values/styles.xml
          <resources>
            <style name="Theme.DarkNotes" parent="Theme.AppCompat.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
            </style>
          </resources>
          EOF

          cat << 'EOF' > offline-app/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          EOF

          cat << 'EOF' > offline-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="@string/app_name"
              android:theme="@style/Theme.DarkNotes"
              android:networkSecurityConfig="@xml/network_security_config"
              android:hardwareAccelerated="true"
              android:allowBackup="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > offline-app/app/src/main/java/com/priyamrai/darknotes/MainActivity.java
          package com.priyamrai.darknotes;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              webView = new WebView(this);
              webView.setLayoutParams(new ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
              ));
              webView.setBackgroundColor(Color.BLACK);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowFileAccess(false);
              settings.setAllowContentAccess(false);
              settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

              final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this))
                .build();

              webView.setWebViewClient(new WebViewClientCompat() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  return assetLoader.shouldInterceptRequest(request.getUrl());
                }
              });

              setContentView(webView);
              webView.loadUrl("https://appassets.androidplatform.net/index.html");
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          EOF

      - name: Compile Signed Dark Notes APK
        run: |
          cd offline-app
          gradle assembleRelease --no-daemon

      - name: Package Dark Notes APK & Keystore
        run: |
          mkdir -p release-bundle
          cp offline-app/app/build/outputs/apk/release/app-release.apk release-bundle/Dark-Notes-Offline.apk
          cp android.keystore release-bundle/android.keystore

      - name: Upload Dark Notes APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Notes-Offline-APK
          path: release-bundle/
