name: Build Dark Notes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Compile Dark Notes Web Bundle
        run: |
          mkdir -p web-src offline-app/app/src/main/assets
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d web-src
          else
            cp -r ./* web-src/ 2>/dev/null || true
          fi

          PKG_PATH=$(find web-src -maxdepth 3 -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found in Dark Notes ZIP!"
            exit 1
          fi

          APP_DIR=$(dirname "$PKG_PATH")
          echo "Building Dark Notes from: $APP_DIR"
          cd "$APP_DIR"
          npm install --legacy-peer-deps
          npm run build

          export ASSETS_OUT="$GITHUB_WORKSPACE/offline-app/app/src/main/assets"
          python3 - << 'PYEOF'
          import os, shutil, glob, json

          assets_out = os.environ["ASSETS_OUT"]
          os.makedirs(assets_out, exist_ok=True)

          copied = False
          for candidate in [".output/public", "dist/client", "dist", "build"]:
              if os.path.isdir(candidate):
                  print(f"Copying build output from: {candidate}")
                  shutil.copytree(candidate, assets_out, dirs_exist_ok=True)
                  copied = True

          if not copied:
              raise SystemExit("ERROR: No web build output directory found!")

          for pattern in ["sw.js", "workbox-*.js"]:
              for f in glob.glob(os.path.join(assets_out, pattern)):
                  os.remove(f)

          index_path = os.path.join(assets_out, "index.html")
          if not os.path.isfile(index_path):
              print("Generating index.html for TanStack client bundle...")
              css_files = []
              entry_js = None

              manifest_candidates = [
                  os.path.join(assets_out, ".vite", "manifest.json"),
                  "dist/client/.vite/manifest.json",
              ]
              for mf in manifest_candidates:
                  if os.path.isfile(mf):
                      with open(mf, "r", encoding="utf-8") as fp:
                          manifest = json.load(fp)
                      for item in manifest.values():
                          if item.get("isEntry"):
                              entry_js = item.get("file")
                              css_files.extend(item.get("css", []))
                              break
                      if entry_js:
                          break

              assets_sub = os.path.join(assets_out, "assets")
              if os.path.isdir(assets_sub):
                  all_files = sorted(os.listdir(assets_sub))
                  if not css_files:
                      css_files = [f"assets/{f}" for f in all_files if f.endswith(".css")]
                  if not entry_js:
                      js_files = [f for f in all_files if f.endswith(".js")]
                      for prefix in ("main-", "client-", "entry-", "app-", "index-"):
                          matches = [f for f in js_files if f.startswith(prefix)]
                          if matches:
                              entry_js = f"assets/{matches[0]}"
                              break
                      if not entry_js and js_files:
                          largest = max(js_files, key=lambda f: os.path.getsize(os.path.join(assets_sub, f)))
                          entry_js = f"assets/{largest}"

              css_tags = "\n    ".join(
                  f'<link rel="stylesheet" href="./{c.lstrip("./")}" />' for c in dict.fromkeys(css_files)
              )
              js_tag = (
                  f'<script type="module" src="./{entry_js.lstrip("./")}"></script>'
                  if entry_js else ""
              )

              html = f"""<!doctype html>
          <html lang="en" class="dark">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Dark Notes</title>
              {css_tags}
              <style>
                html, body, #root, #app {{
                  margin: 0;
                  padding: 0;
                  width: 100%;
                  min-height: 100%;
                  background: #000000;
                  color: #ffffff;
                }}
              </style>
            </head>
            <body>
              <div id="root"></div>
              <div id="app"></div>
              {js_tag}
            </body>
          </html>
          """
              with open(index_path, "w", encoding="utf-8") as fp:
                  fp.write(html)
              print(f"Generated index.html with entry_js={entry_js}, css={css_files}")
          PYEOF

          echo "Final assets root contents:"
          ls -la "$ASSETS_OUT/"
          ls -la "$ASSETS_OUT/assets/" 2>/dev/null || true

      - name: Create Dark Notes Offline Android Project
        run: |
          mkdir -p offline-app/app/src/main/java/com/priyamrai/darknotes
          mkdir -p offline-app/app/src/main/res/values
          mkdir -p offline-app/app/src/main/res/xml
          mkdir -p offline-app/app/src/main/res/drawable

          keytool -genkeypair -v \
            -keystore offline-app/app/android.keystore \
            -alias darknotes \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Dark Notes, OU=App, O=Priyam Rai, L=Lucknow, S=UP, C=IN"

          if [ -f offline-app/app/src/main/assets/icon-512.png ]; then
            cp offline-app/app/src/main/assets/icon-512.png offline-app/app/src/main/res/drawable/ic_launcher.png
          elif [ -f offline-app/app/src/main/assets/icon-192.png ]; then
            cp offline-app/app/src/main/assets/icon-192.png offline-app/app/src/main/res/drawable/ic_launcher.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" | base64 -d > offline-app/app/src/main/res/drawable/ic_launcher.png
          fi

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' > offline-app/gradle.properties

          printf '%s\n' \
            'rootProject.name = "DarkNotesOffline"' \
            "include ':app'" > offline-app/settings.gradle

          printf '%s\n' \
            'buildscript {' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '  }' \
            '  dependencies {' \
            "    classpath 'com.android.tools.build:gradle:8.5.2'" \
            '  }' \
            '}' \
            'allprojects {' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '  }' \
            '}' > offline-app/build.gradle

          printf '%s\n' \
            'plugins {' \
            "  id 'com.android.application'" \
            '}' \
            'android {' \
            '  namespace "com.priyamrai.darknotes"' \
            '  compileSdk 34' \
            '  defaultConfig {' \
            '    applicationId "com.priyamrai.darknotes"' \
            '    minSdk 24' \
            '    targetSdk 34' \
            '    versionCode 1' \
            '    versionName "1.0"' \
            '  }' \
            '  compileOptions {' \
            '    sourceCompatibility JavaVersion.VERSION_17' \
            '    targetCompatibility JavaVersion.VERSION_17' \
            '  }' \
            '  signingConfigs {' \
            '    release {' \
            '      storeFile file("android.keystore")' \
            '      storePassword "android123"' \
            '      keyAlias "darknotes"' \
            '      keyPassword "android123"' \
            '    }' \
            '  }' \
            '  buildTypes {' \
            '    release {' \
            '      signingConfig signingConfigs.release' \
            '      minifyEnabled false' \
            '      shrinkResources false' \
            '    }' \
            '  }' \
            '}' \
            'dependencies {' \
            "  implementation 'androidx.appcompat:appcompat:1.7.0'" \
            "  implementation 'androidx.webkit:webkit:1.11.0'" \
            '}' > offline-app/app/build.gradle

          printf '%s\n' \
            '<resources>' \
            '  <string name="app_name">Dark Notes</string>' \
            '</resources>' > offline-app/app/src/main/res/values/strings.xml

          printf '%s\n' \
            '<resources>' \
            '  <style name="Theme.DarkNotes" parent="Theme.AppCompat.NoActionBar">' \
            '    <item name="android:windowBackground">#000000</item>' \
            '    <item name="android:statusBarColor">#000000</item>' \
            '    <item name="android:navigationBarColor">#000000</item>' \
            '  </style>' \
            '</resources>' > offline-app/app/src/main/res/values/styles.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<network-security-config>' \
            '  <base-config cleartextTrafficPermitted="false" />' \
            '</network-security-config>' > offline-app/app/src/main/res/xml/network_security_config.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application' \
            '    android:label="@string/app_name"' \
            '    android:icon="@drawable/ic_launcher"' \
            '    android:theme="@style/Theme.DarkNotes"' \
            '    android:networkSecurityConfig="@xml/network_security_config"' \
            '    android:hardwareAccelerated="true"' \
            '    android:allowBackup="true">' \
            '    <activity' \
            '      android:name=".MainActivity"' \
            '      android:exported="true"' \
            '      android:configChanges="orientation|screenSize|keyboardHidden">' \
            '      <intent-filter>' \
            '        <action android:name="android.intent.action.MAIN" />' \
            '        <category android:name="android.intent.category.LAUNCHER" />' \
            '      </intent-filter>' \
            '    </activity>' \
            '  </application>' \
            '</manifest>' > offline-app/app/src/main/AndroidManifest.xml

          printf '%s\n' \
            'package com.priyamrai.darknotes;' \
            'import android.graphics.Color;' \
            'import android.net.Uri;' \
            'import android.os.Bundle;' \
            'import android.view.ViewGroup;' \
            'import android.webkit.WebChromeClient;' \
            'import android.webkit.WebResourceRequest;' \
            'import android.webkit.WebResourceResponse;' \
            'import android.webkit.WebSettings;' \
            'import android.webkit.WebView;' \
            'import androidx.activity.OnBackPressedCallback;' \
            'import androidx.appcompat.app.AppCompatActivity;' \
            'import androidx.webkit.WebViewAssetLoader;' \
            'import androidx.webkit.WebViewClientCompat;' \
            'public class MainActivity extends AppCompatActivity {' \
            '  private WebView webView;' \
            '  @Override' \
            '  protected void onCreate(Bundle savedInstanceState) {' \
            '    super.onCreate(savedInstanceState);' \
            '    webView = new WebView(this);' \
            '    webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));' \
            '    webView.setBackgroundColor(Color.BLACK);' \
            '    WebSettings settings = webView.getSettings();' \
            '    settings.setJavaScriptEnabled(true);' \
            '    settings.setDomStorageEnabled(true);' \
            '    settings.setDatabaseEnabled(true);' \
            '    settings.setAllowFileAccess(false);' \
            '    settings.setAllowContentAccess(false);' \
            '    settings.setCacheMode(WebSettings.LOAD_NO_CACHE);' \
            '    final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder().addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this)).build();' \
            '    webView.setWebChromeClient(new WebChromeClient());' \
            '    webView.setWebViewClient(new WebViewClientCompat() {' \
            '      @Override' \
            '      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {' \
            '        Uri url = request.getUrl();' \
            '        WebResourceResponse response = assetLoader.shouldInterceptRequest(url);' \
            '        if (response == null && "appassets.androidplatform.net".equals(url.getHost())) {' \
            '          String path = url.getPath();' \
            '          if (path == null || !path.contains(".")) {' \
            '            return assetLoader.shouldInterceptRequest(Uri.parse("https://appassets.androidplatform.net/index.html"));' \
            '          }' \
            '        }' \
            '        return response;' \
            '      }' \
            '    });' \
            '    getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {' \
            '      @Override' \
            '      public void handleOnBackPressed() {' \
            '        if (webView != null && webView.canGoBack()) {' \
            '          webView.goBack();' \
            '        } else {' \
            '          setEnabled(false);' \
            '          getOnBackPressedDispatcher().onBackPressed();' \
            '        }' \
            '      }' \
            '    });' \
            '    setContentView(webView);' \
            '    webView.loadUrl("https://appassets.androidplatform.net/");' \
            '  }' \
            '}' > offline-app/app/src/main/java/com/priyamrai/darknotes/MainActivity.java

      - name: Compile Signed Dark Notes APK
        run: |
          cd offline-app
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Dark Notes APK & Keystore
        run: |
          mkdir -p release-bundle
          cp offline-app/app/build/outputs/apk/release/app-release.apk release-bundle/Dark-Notes-Offline.apk
          cp offline-app/app/android.keystore release-bundle/android.keystore

      - name: Upload Dark Notes APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Notes-Offline-APK
          path: release-bundle/
